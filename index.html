<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />

  <!-- ============================================================
       CONTENT-SECURITY-POLICY
       ⚠️ EN PREMIER dans le <head> : une politique en balise ne régit que ce
       qui la SUIT dans le document. La déplacer plus bas la rendrait
       partiellement inopérante, sans aucun message d'erreur.
       ⚠️ Elle NE régit PAS sw.js : un service worker a son propre contexte.
       ⚠️ GitHub Pages ne pose aucun en-tête HTTP, donc le mode `Report-Only`
       (observer sans bloquer) est indisponible : toute modification ici se
       teste EN AVEUGLE, sur DEV, console ouverte, en parcourant toute l'app.

       🔴 RÈGLE PERMANENTE : toute nouvelle ressource externe — script, police,
       image, point d'API — doit être ajoutée ICI dans le même dépôt, sinon le
       navigateur la bloque SANS message visible. Symptômes à reconnaître :
       graphiques blancs (script-src), typographie changée (style/font-src),
       app qui démarre mais sans aucune donnée (connect-src). Cf. §2 et §8.

       Ce qui est protégé, et ce qui ne l'est pas :
       - script-src est STRICT : origines épinglées + les deux scripts inline
         autorisés par EMPREINTE. Les empreintes ne tiennent que parce que ces
         scripts ne contiennent aucun `?v=` (cf. la balise app-build plus bas) ;
         y réintroduire un littéral de version les invaliderait à chaque dépôt.
       - style-src garde 'unsafe-inline', OBLIGATOIRE : 407 `style={{…}}` dans
         le JS. S'en passer demanderait une réécriture massive. Ce n'est donc
         pas une protection totale, et il ne faut pas la vendre comme telle.
       - connect-src liste les 5 hôtes Firebase, RECOPIÉS de PASSTHROUGH_HOSTS
         de sw.js — surtout PAS déduits du panneau réseau : une session
         complète n'en révèle que 2, les autres n'apparaissent qu'au
         rafraîchissement de jeton ou à l'installation. `wss:` sur Firestore
         est une ceinture : le SDK utilise du long-polling HTTP
         (experimentalAutoDetectLongPolling), mais s'il basculait un jour sur
         WebSocket, le symptôme serait « plus aucune donnée ».
       ============================================================ -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' https://unpkg.com https://www.gstatic.com 'sha256-yPuM7RuD9GGnOgZBIJ/pTUIsl3RMPgOnnolzDAR36nE=' 'sha256-LQQRAwMBhpob2xH4RomBl1mVXeCIU8aUy2vQQeRG4Sw=';
    style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
    font-src https://fonts.gstatic.com;
    img-src 'self' data:;
    connect-src 'self' https://firestore.googleapis.com wss://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://www.googleapis.com https://firebaseinstallations.googleapis.com;
    manifest-src 'self';
    worker-src 'self';
    frame-src 'none';
    object-src 'none';
    base-uri 'none';
    form-action 'self';
  " />
  <!-- maximum-scale=1 : bloque le ZOOM AUTOMATIQUE d'iOS au focus d'un champ
       (déclenchable même à 16px par l'overlay de remplissage de mot de passe).
       En PWA, ce zoom ne se relâche jamais et fait défiler les éléments
       position:fixed avec le contenu (barre de nav qui « bouge »). iOS ignore
       maximum-scale pour le pinch UTILISATEUR depuis iOS 10 : le zoom manuel
       reste possible, seul le zoom auto est neutralisé. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
  <title>Patrimoine</title>

  <!-- BUILD PRÉCOMPILÉ : le JSX est compilé en amont par esbuild, Babel
       standalone n'est plus chargé et n'injecte plus de script inline. C'est ce
       qui a rendu le Content-Security-Policy ci-dessus possible — il est en
       place depuis le 31/07/2026. Les autres mesures restent en place : SRI sur
       les CDN, règles Firestore, validation des imports JSON. -->

  <meta name="theme-color" content="#fafafa" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />

  <!-- Manifest PWA : permet l'installation Android/Chrome (nom, icônes, mode
       standalone, couleur de thème, écran de démarrage).
       Sélection DYNAMIQUE : sous /patrimoine-dev/ (dépôt GitHub Pages de
       test) ou en localhost, on charge manifest-dev.json ("Patrimoine DEV")
       pour distinguer les deux PWA installées sur l'écran d'accueil.
       Même critère pathname que le switch Firebase de config.js. -->
  <!-- Version de build — PLACEHOLDER réécrit par le workflow GitHub à chaque
       publication (VERSION_BASE + n° de run), comme tous les `?v=` de ce
       fichier et de sw.js. Ne pas la maintenir à la main.
       ⚠️ Elle vit dans cette balise, et NON dans le script ci-dessous, à dessein :
       le script est destiné à être autorisé par EMPREINTE sha256 dans un
       Content-Security-Policy, et une empreinte ne vaut que si le contenu ne
       change pas. Y laisser un `?v=` la ferait changer à CHAQUE déploiement,
       donc bloquer le script — et avec lui le numéro de version affiché et la
       sélection du manifest. Cf. CLAUDE.md §11. -->
  <meta name="app-build" content="?v=614" />
  <script>
    (function () {
      // Version lue dans la balise <meta app-build> ci-dessus : ce script ne
      // contient donc AUCUN `?v=` et son contenu est stable d'une version à
      // l'autre (cf. le commentaire ci-dessus — ne pas y réintroduire de
      // littéral de version).
      var m = document.querySelector('meta[name="app-build"]');
      var v = (m && m.getAttribute('content')) || '';
      // Affichée en pied du menu « ⋯ » et loguée en console : permet de
      // vérifier d'un coup d'œil quelle version tourne réellement sur
      // l'appareil (cache Safari, déploiement Pages…).
      window.APP_BUILD = v.replace('?v=', 'v');
      var isDev = location.pathname.indexOf('/patrimoine-dev') === 0
               || location.hostname === 'localhost'
               || location.hostname === '127.0.0.1';
      var link = document.createElement('link');
      link.rel = 'manifest';
      link.href = (isDev ? 'manifest-dev.json' : 'manifest.json') + v;
      document.head.appendChild(link);
      if (isDev) {
        // Titre iOS (Ajouter à l'écran d'accueil) + titre d'onglet distincts
        var m = document.querySelector('meta[name="apple-mobile-web-app-title"]');
        if (m) m.setAttribute('content', 'Patri. DEV');
        document.title = 'Patrimoine DEV';
      }
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Cache-busting : incrémenter cette version à chaque modif visible
       pour forcer le navigateur (notamment iOS Safari) à recharger les
       fichiers JS/CSS depuis le serveur. -->
  <link rel="stylesheet" href="styles.css?v=614" />

  <!-- React + Recharts + Babel + Firebase
       Tous les scripts CDN sont protégés par un hash SRI (Subresource
       Integrity). Si la CDN sert un fichier altéré, le navigateur refuse
       de l'exécuter. Les versions sont strictement pinées : ne change pas
       une version sans regénérer le hash sha384 correspondant. -->
  <script crossorigin="anonymous"
          integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z"

  <script crossorigin="anonymous"

  <script crossorigin="anonymous"
          integrity="sha384-/AfDwVDXNopzPvhxMPQ11y1OCpR6mVkWx47qzSwIiquvxkcMkZddEzDNtIOtfCpk"
          src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
  <script crossorigin="anonymous"
          integrity="sha384-d1XH4LhwLW8j0l6VXMP8yJabdGY9ZqtZk7k7PaPk5NoUCcZ/hDkL5aaKioKQbcZg"

  <script crossorigin="anonymous"

  <script crossorigin="anonymous"
          integrity="sha384-I1LYojsZ5RM1cOda44Z2h42Qa6YfsQ1XkXxREnhp4ueYBR/4d1pG1K+NZM537Vsj"

  <!-- Service worker (mode hors ligne, v522) : enregistré après « load »
       pour ne pas concurrencer le démarrage. sw.js est volontairement
       chargé SANS chaîne de version : c'est le changement de son CONTENU
       (la constante VERSION, réécrite par le workflow à la publication) qui
       déclenche la détection de mise à jour par le navigateur.
       Détection → window.__SW_WAITING + événement 'patrimoine:sw-update'
       écoutés par app.js (toast « Nouvelle version disponible »). -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        // Garde-fou controllerchange : lors de la TOUTE PREMIÈRE
        // installation, clients.claim() déclenche déjà un controllerchange
        // (null → SW) qu'il ne faut PAS transformer en reload.
        var hadController = !!navigator.serviceWorker.controller;
        navigator.serviceWorker.addEventListener('controllerchange', function () {
          if (!hadController) { hadController = true; return; }
          window.location.reload();
        });
        navigator.serviceWorker.register('sw.js').then(function (reg) {
          function notify(worker) {
            // Tampon : app.js peut ne pas être encore monté (Babel compile
            // après « load ») — il lit __SW_WAITING à son montage.
            window.__SW_WAITING = worker;
            window.dispatchEvent(new CustomEvent('patrimoine:sw-update', { detail: worker }));
          }
          // Mise à jour déjà en attente (téléchargée à une visite précédente)
          if (reg.waiting && navigator.serviceWorker.controller) notify(reg.waiting);
          reg.addEventListener('updatefound', function () {
            var w = reg.installing;
            if (!w) return;
            w.addEventListener('statechange', function () {
              // « installed » avec un controller actif = une NOUVELLE version
              // attend (à la première installation, controller est null →
              // pas de toast, le SW s'active silencieusement).
              if (w.state === 'installed' && navigator.serviceWorker.controller) notify(w);
            });
          });
          // v548 — nos utilisateurs ne ferment jamais la PWA (juste au 1er
          // plan). Sans navigation, le navigateur ne vérifie les MàJ que ~24h.
          // On force donc une vérification à CHAQUE retour au premier plan :
          // le toast apparaît alors rapidement après un déploiement.
          document.addEventListener('visibilitychange', function () {
            if (document.visibilityState === 'visible') {
              reg.update().catch(function () {});
              if (reg.waiting && navigator.serviceWorker.controller) notify(reg.waiting);
            }
          });
        }).catch(function () { /* SW indisponible : l'app marche comme avant */ });
      });
    }
  </script>
